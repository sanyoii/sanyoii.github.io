<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ffffff">
<title>生圖 Prompt 組合器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1>生圖 Prompt 組合器</h1>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="搜尋：霓虹、warm、/softglow" enterkeyhint="search" autocomplete="off" aria-label="搜尋指令">
    <button id="searchClear" class="icon-btn" type="button" aria-label="清除搜尋" hidden>✕</button>
  </div>
  <div class="seg" id="tools" role="radiogroup" aria-label="輸出工具"></div>
  <button id="openRecipes" class="ghost-btn" type="button">☆ 我的配方 <span id="recipeCount"></span></button>
</header>

<main class="layout">
  <div class="tpl-row" id="tplRow" aria-label="情境模板"></div>

  <div class="subj-box">
    <label for="subject" class="lbl">① 主體（中文即可）</label>
    <textarea id="subject" rows="2" placeholder="例：一杯冰拿鐵放在木頭桌上，旁邊有一本打開的筆記本"></textarea>
  </div>

  <nav class="cats" id="cats" aria-label="分類"></nav>

  <section class="mid">
    <div class="mid-head"><h2 id="midTitle"></h2><p class="hint" id="midHint"></p></div>
    <div class="grid" id="grid"></div>
    <footer class="src">指令內容來源：傑森所長《ChatGPT生圖指令大全》<a href="https://jasonxtsai.github.io/pages/jason/chatgpt-image-commands.html" target="_blank" rel="noopener">原頁連結</a>，僅供個人使用。</footer>
  </section>

  <aside class="side" id="side">
    <div class="sheet-grab" id="sheetToggle" role="button" tabindex="0" aria-label="展開或收合 prompt"><span></span></div>
    <div class="side-row">
      <span class="lbl">② 已選指令 <b id="count">0</b>／建議 ≤4</span>
      <button id="clearSel" class="link-btn" type="button">清空</button>
    </div>
    <div class="chips" id="chips"></div>
    <div id="warns" class="warns" aria-live="polite"></div>
    <div class="opt-row">
      <div class="opt">
        <span class="lbl">③ 比例</span>
        <div class="seg small" id="ratios" role="radiogroup" aria-label="比例"></div>
      </div>
      <div class="opt grow">
        <label class="lbl" for="imgText">④ 圖中文字（留空＝不要字）</label>
        <input id="imgText" type="text" placeholder="例：三分鐘學會打光" autocomplete="off">
      </div>
    </div>
    <div class="side-row"><span class="lbl">⑤ 組好的 prompt（<span id="toolName"></span> 格式）</span><span class="legend"><mark>[ ]</mark> 要換成你的內容</span><button type="button" class="link-btn more-btn" id="moreBtn">展開全文 ▾</button></div>
    <pre id="out" class="out"></pre>
    <div class="save-row" id="saveRow" hidden>
      <input id="recipeName" type="text" placeholder="配方名稱" autocomplete="off">
      <button id="saveConfirm" class="btn" type="button">儲存</button>
      <button id="saveCancel" class="link-btn" type="button">取消</button>
    </div>
    <div class="btn-row">
      <button id="saveRecipe" class="btn" type="button">☆ 存成配方</button>
      <button id="copy" class="btn pri" type="button">📋 一鍵複製</button>
    </div>
  </aside>
</main>

<dialog id="recipes" aria-label="我的配方">
  <div class="dlg-head"><h3>☆ 我的配方</h3><button class="icon-btn" id="closeRecipes" type="button" aria-label="關閉">✕</button></div>
  <div id="recipeList"></div>
  <p class="hint">配方存在這台裝置的瀏覽器（localStorage），換瀏覽器或清除資料會不見。</p>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script src="commands.js"></script>
<script src="app.js"></script>
</body>
</html>

name: Test and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio site
        uses: actions/checkout@v7
        with:
          path: site

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: site/tests/requirements.txt

      - name: Install portfolio test dependencies
        working-directory: site
        run: pip install -r tests/requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Test portfolio site
        working-directory: site
        run: python -m pytest tests/ -v

      - name: Check out QA Decision Desk
        uses: actions/checkout@v7
        with:
          repository: sanyoii/RiskQADemoSite
          ref: main
          path: dashboard

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Test and lint Dashboard
        working-directory: dashboard
        run: |
          npm test
          npm run lint

      - name: Export Dashboard for GitHub Pages
        working-directory: dashboard
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Assemble public artifact
        shell: bash
        run: |
          mkdir public
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.pytest_cache' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude 'test-records' \
            --exclude 'tests' \
            site/ public/
          node dashboard/scripts/prepare-pages-artifact.mjs \
            --source dashboard/dist/client \
            --output public/test-status

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

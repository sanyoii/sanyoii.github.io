<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">sanyoii.github.io — 零依賴雙語個人網站，附十二條自動化測試</title>
  <desc id="hero-desc">Left: the repository name, a one-line description, and the toolchain. Right: the twelve automated checks from TESTPLAN.md, listed in two columns, with one documented accepted exception noted below.</desc>

  <defs>
    <style>
      .u { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, "PingFang TC", "Microsoft JhengHei", monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="12" fill="#0d0d0e"/>

  <!-- title block -->
  <g id="title-block" transform="translate(56 66)">
    <text class="m" x="0" y="0" font-size="18" letter-spacing="2.4" fill="#e68541">個人網站 · 無建置流程</text>

    <text class="u" x="0" y="76" font-size="62" font-weight="300" fill="#efeae1">sanyoii.github.io</text>

    <rect x="0" y="104" width="56" height="2" fill="#e68541"/>

    <text class="u" x="0" y="152" font-size="27" font-weight="400" fill="#efeae1">一個 HTML 檔。兩種語言。</text>
    <text class="u" x="0" y="188" font-size="27" font-weight="400" fill="#8a847c">十二條測試作證。</text>

    <text class="m" x="0" y="240" font-size="18" fill="#8a847c">pytest · Playwright · Chromium · CI 於 push main 觸發</text>
  </g>

  <!-- real project material: the test inventory from TESTPLAN.md -->
  <g id="test-inventory" transform="translate(648 52)">
    <text class="m" x="0" y="0" font-size="18" letter-spacing="1.8" fill="#8a847c">測試清單</text>
    <line x1="0" y1="16" x2="496" y2="16" stroke="#2a2724" stroke-width="1"/>

    <!-- column 1 -->
    <g transform="translate(0 48)">
      <g><path d="M0 -5 l5 6 l9 -12" stroke="#e68541" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="u" x="26" y="0" font-size="20" fill="#efeae1">雙語逐句配對</text></g>
      <g transform="translate(0 38)"><path d="M0 -5 l5 6 l9 -12" stroke="#e68541" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="u" x="26" y="0" font-size="20" fill="#efeae1">電話號碼未外洩</text></g>
      <g transform="translate(0 76)"><path d="M0 -5 l5 6 l9 -12" stroke="#e68541" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="u" x="26" y="0" font-size="20" fill="#efeae1">Doctype＋單一 h1</text></g>
      <g transform="translate(0 114)"><path d="M0 -5 l5 6 l9 -12" stroke="#e68541" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="u" x="26" y="0" font-size="20" fill="#efeae1">外部連結白名單</text></g>
      <g transform="translate(0 152)"><path d="M0 -5 l5 6 l9 -12" stroke="#e68541" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="u" x="26" y="0" font-size="20" fill="#efeae1">零外部網路請求</text></g>
      <g transform="translate(0 190)"><path d="M0 -5 l5 6 l9 -12" stroke="#e68541" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="u" x="26" y="0" font-size="20" fill="#efeae1">標準渲染模式</text></g>
    </g>

    <!-- column 2 -->
    <g transform="translate(264 48)">
      <g><path d="M0 -5 l5 6 l9 -12" stroke="#e68541" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="u" x="26" y="0" font-size="20" fill="#efeae1">無水平溢出</text></g>
      <g transform="translate(0 38)"><path d="M0 -5 l5 6 l9 -12" stroke="#e68541" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="u" x="26" y="0" font-size="20" fill="#efeae1">語言選擇持久化</text></g>
      <g transform="translate(0 76)"><path d="M0 -5 l5 6 l9 -12" stroke="#e68541" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="u" x="26" y="0" font-size="20" fill="#efeae1">首屏高度預算</text></g>
      <g transform="translate(0 114)"><path d="M0 -5 l5 6 l9 -12" stroke="#e68541" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="u" x="26" y="0" font-size="20" fill="#efeae1">行動版不重疊</text></g>
      <g transform="translate(0 152)"><path d="M0 -5 l5 6 l9 -12" stroke="#e68541" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="u" x="26" y="0" font-size="20" fill="#efeae1">減少動態仍可讀</text></g>
      <g transform="translate(0 190)"><path d="M0 -5 l5 6 l9 -12" stroke="#e68541" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="u" x="26" y="0" font-size="20" fill="#efeae1">404 不進索引</text></g>
    </g>

    <line x1="0" y1="266" x2="496" y2="266" stroke="#2a2724" stroke-width="1"/>
    <text class="m" x="0" y="290" font-size="18" fill="#8a847c">1 條已接受例外，明文記錄於 TESTPLAN.md</text>
  </g>
</svg>
